# API + AI agent on one EC2 host, behind Caddy (HTTPS + WebSockets). See docs/deploy.md, "AWS + Neon + Vercel".
# Run from the repo root: docker compose -f docs/deploy/aws/docker-compose.yml --env-file docs/deploy/aws/.env up -d --build
services:
  agent:
    build: ../../../backend-services
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY}
    restart: always

  api:
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      AGENT_URL: http://agent:8000
    volumes:
      - evidence:/data
    depends_on:
      - agent
    restart: always

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - api
    restart: always

volumes:
  evidence:
  caddy:
